[package]
name = "mizuchi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Arrow-native query and transform engine in Rust: single-node first, distributed later."
keywords = ["sql", "arrow", "query-engine", "dataframe", "data"]
categories = ["database-implementations"]
homepage = "https://github.com/Sannrox/mizuchi"

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
sqlparser = { workspace = true }
object_store = { workspace = true }
futures = { workspace = true }

[features]
default = []
# Optional Amazon S3 client for the ignored emulator test. The engine API takes
# a caller-provided ObjectStore; it does not open S3 itself.
s3 = ["object_store/aws"]

[dev-dependencies]
arrow = { workspace = true }
