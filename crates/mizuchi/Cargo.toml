[package]
name = "mizuchi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Arrow-native query and transform engine in Rust: single-node first, distributed later."
keywords = ["sql", "arrow", "query-engine", "dataframe", "data"]
categories = ["database-implementations"]
homepage = "https://github.com/Sannrox/mizuchi"

[dependencies]
arrow = { workspace = true }
arrow-avro = { workspace = true }
parquet = { workspace = true }
sqlparser = { workspace = true }
object_store = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
postgres = { workspace = true, optional = true }
postgres-native-tls = { workspace = true, optional = true }
native-tls = { workspace = true, optional = true }

[features]
default = []
# Optional Amazon S3 client for the ignored emulator test. The engine API takes
# a caller-provided ObjectStore; it does not open S3 itself.
s3 = ["object_store/aws"]
# Optional Linux filesystem-limit tests in `tests/sandbox_os.rs`. Library
# sources do not use this feature.
sandbox = []
# Optional PostgreSQL source. Opens TCP only when the embedder sets
# `SessionConfig.allow_network`. Default tests do not enable this.
postgres = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]

[dev-dependencies]
arrow = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
landlock = "0.4.7"
