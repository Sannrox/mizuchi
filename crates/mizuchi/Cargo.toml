[package]
name = "mizuchi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "../../README.md"
description = "Arrow-native query and transform engine in Rust: single-node first, distributed later."
keywords = ["sql", "arrow", "query-engine", "dataframe", "data"]
categories = ["database-implementations"]
homepage = "https://github.com/Sannrox/mizuchi"

[dependencies]
arrow = { workspace = true }
mizuchi-core = { workspace = true }
mizuchi-exec = { workspace = true }
mizuchi-flight = { path = "../mizuchi-flight", version = "0.1.0", optional = true }
mizuchi-io = { workspace = true }
mizuchi-plan = { workspace = true }
mizuchi-postgres = { workspace = true }
object_store = { workspace = true }
sqlparser = { workspace = true }

[features]
default = []
s3 = ["mizuchi-io/s3", "mizuchi-exec/s3"]
sandbox = []
postgres = ["mizuchi-postgres/client", "mizuchi-exec/postgres"]
flight = ["dep:mizuchi-flight"]

[[bin]]
name = "mizuchi"
path = "src/bin/mizuchi.rs"
required-features = ["flight"]

[[test]]
name = "flight_cluster"
path = "tests/flight_cluster.rs"
required-features = ["flight"]

[dev-dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
landlock = "0.4.7"
