name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --workspace --all-targets --exclude mizuchi-flight
      - name: Test
        run: cargo test --locked --workspace --exclude mizuchi-flight

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path python/Cargo.toml -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --exclude mizuchi-flight -- -D warnings

  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/validate-workflow-skills.sh

  python-wheel:
    name: Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Clippy Python crate
        run: cargo clippy --manifest-path python/Cargo.toml -- -D warnings
      - name: Build and install wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.15.0
          maturin build --release --locked -o dist
          python -m pip install dist/*.whl
      - name: Run examples
        run: |
          python -m pip install pyarrow==26.0.0
          python python/examples/lazy_df.py
          python python/examples/udf_arrow.py

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Run fuzz targets
        run: |
          cargo +nightly fuzz run parse -- -max_total_time=15 -len_control=0
          cargo +nightly fuzz run plan -- -max_total_time=15 -len_control=0
          cargo +nightly fuzz run execute -- -max_total_time=15 -len_control=0
          cargo +nightly fuzz run grammar -- -max_total_time=20 -len_control=0

  s3-emulator:
    name: S3 emulator
    runs-on: ubuntu-latest
    env:
      MIZUCHI_S3_ENDPOINT: http://127.0.0.1:9000
      MIZUCHI_S3_BUCKET: mizuchi
      MIZUCHI_S3_ACCESS_KEY: minioadmin
      MIZUCHI_S3_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v7
      - name: Start MinIO
        run: bash scripts/start-s3-emulator.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: S3 emulator tests (fail if skipped)
        run: |
          set -euo pipefail
          list=$(cargo test --locked --test s3_emulator --features s3 -- --ignored --list)
          echo "$list"
          n=$(printf '%s\n' "$list" | grep -c ': test$' || true)
          if [ "$n" -lt 1 ]; then
            echo "S3 emulator tests were skipped" >&2
            exit 1
          fi
          cargo test --locked --test s3_emulator --features s3 -- --ignored --test-threads=1
