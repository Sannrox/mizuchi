name: Flight multi-worker

# Optional job. Never on pull requests. Default cargo test stays offline.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  flight-workers:
    name: Three Flight workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Flight grant and shuffle
        run: cargo test --locked --features flight --test flight_cluster
      - name: Decision-support with mid-query kill
        run: cargo test --locked --features flight --test flight_cluster -- --ignored --test-threads=1
