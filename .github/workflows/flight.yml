name: Flight multi-worker

# Optional job. Never on pull requests. Default cargo test stays offline.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  flight-workers:
    name: Three Flight workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Flight grant and shuffle
        run: cargo test --locked --features flight --test flight_cluster
      - name: Decision-support with mid-query kill
        run: cargo test --locked --features flight --test flight_cluster -- --ignored --test-threads=1
