name: PostgreSQL source

# Optional job. Never on pull requests. Default cargo test stays offline.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres-pushdown:
    name: PostgreSQL filter pushdown
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizuchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIZUCHI_POSTGRES_URL: host=localhost port=5432 user=postgres password=postgres dbname=mizuchi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Pushdown SQL (default tests)
        run: cargo test --locked -p mizuchi-postgres --lib
      - name: Live source
        run: cargo test --locked --test postgres --features postgres -- --ignored --test-threads=1
