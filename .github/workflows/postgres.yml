name: PostgreSQL source

# Optional job. Never on pull requests. Default cargo test stays offline.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres-pushdown:
    name: PostgreSQL filter pushdown
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mizuchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIZUCHI_POSTGRES_URL: host=localhost port=5432 user=postgres password=postgres dbname=mizuchi
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Pushdown SQL (default tests)
        run: cargo test --locked --lib postgres::tests
      - name: Live source
        run: cargo test --locked --test postgres --features postgres -- --ignored --test-threads=1
