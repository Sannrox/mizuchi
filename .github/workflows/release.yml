name: Release

# Tagged and manual only. Never on pull requests. Default cargo test stays
# offline. A v* tag publishes the GitHub Release; workflow_dispatch packages
# the same files and does not attest or upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  crate:
    name: Crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Package workspace crates
        run: |
          mkdir -p dist
          for p in mizuchi-core mizuchi-plan mizuchi-io mizuchi-postgres mizuchi-exec mizuchi mizuchi-flight; do
            echo "::group::$p"
            cargo package --list --locked -p "$p"
            cargo package --locked -p "$p"
            echo "::endgroup::"
          done
          cp target/package/*.crate dist/
      - name: Dry-run crates.io pack (mizuchi-core)
        run: cargo publish --locked --dry-run -p mizuchi-core
      - name: Facade package contains readme
        run: |
          list=$(cargo package --list --locked -p mizuchi)
          printf '%s\n' "$list"
          echo "$list" | grep -Fx README.md
          echo "$list" | grep -Fx src/lib.rs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-packages
          path: dist/*.crate
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.15.0
          maturin build --release --locked -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  image:
    name: Container image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push, and save
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/sannrox/mizuchi:${version}"
          docker build -f deploy/Dockerfile -t "$image" .
          docker push "$image"
          mkdir -p dist
          docker save "$image" | gzip > "dist/mizuchi-${version}-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-image
          path: dist/mizuchi-*-image.tar.gz
          if-no-files-found: error

  attest:
    name: Attest artifacts
    needs: [crate, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./*.crate ./*.whl > SHA256SUMS
          else
            shasum -a 256 ./*.crate ./*.whl > SHA256SUMS
          fi
      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.whl
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [crate, wheels, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate-packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          python3 - "$version" <<'PY'
          import pathlib, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text()
          heading = f"## [{version}]"
          start = text.find(heading)
          if start < 0:
              notes = f"{heading}\n\nRelease {version}.\n"
          else:
              rest = text[start + len(heading):]
              nxt = rest.find("\n## [")
              body = rest if nxt < 0 else rest[:nxt]
              notes = heading + body
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(notes)
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.crate dist/*.whl dist/SHA256SUMS)
          gh release create "$TAG" "${files[@]}" \
            --title "$TAG" \
            --notes-file dist/RELEASE_NOTES.md

  publish-image:
    name: Attach image to release
    needs: [publish, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
          path: dist
      - name: Attest image archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mizuchi-*-image.tar.gz
      - name: Upload image archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/mizuchi-*-image.tar.gz
