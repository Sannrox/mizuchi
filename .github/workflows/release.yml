name: Release

# Tagged and manual only. Never on pull requests: CI's release dry run
# (scripts/validate-release.sh) covers these scripts there. Default cargo
# test stays offline. A signed v* tag publishes the GitHub Release;
# workflow_dispatch packages the same files and does not attest or upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify signed tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Checkout leaves the tag object behind; verify-tag needs it.
      - name: Fetch annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Refuse lightweight, unsigned, or mismatched tags
        run: bash scripts/verify-release-tag.sh verify "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  source:
    name: Source workspace package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Package and verify the source workspace
        run: bash scripts/package-source.sh dist
      - name: CycloneDX SBOM
        run: |
          python -m pip install 'cyclonedx-python-lib[json-validation]==11.12.0'
          python scripts/release-sbom.py dist/mizuchi.cdx.json
          python scripts/release-sbom.py --check dist/mizuchi.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-package
          path: |
            dist/*-source.tar.gz
            dist/mizuchi.cdx.json
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.15.0
          maturin build --release --locked -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  image:
    name: Container image
    needs: verify-tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.verify-tag.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push, and save
        id: push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/sannrox/mizuchi:${version}"
          docker build -f deploy/Dockerfile -t "$image" .
          docker push "$image"
          # RepoDigests holds name@sha256:... once the push has landed.
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          digest="${digest#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no registry digest for $image" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          docker save "$image" | gzip > "dist/mizuchi-${version}-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-image
          path: dist/mizuchi-*-image.tar.gz
          if-no-files-found: error

  # Provenance and SBOM attestations, then the Tenkai family release manifest
  # (digests, attestation URLs, gate flags), itself attested.
  attest:
    name: Attest artifacts
    needs: [verify-tag, source, wheels, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.verify-tag.result == 'success' && needs.source.result == 'success' && needs.wheels.result == 'success' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.whl ./mizuchi.cdx.json > SHA256SUMS
      - name: Attest artifacts
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*-source.tar.gz
            dist/*-image.tar.gz
            dist/*.whl
            dist/mizuchi.cdx.json
            dist/SHA256SUMS
      - name: Attest image
        id: image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sannrox/mizuchi
          subject-digest: ${{ needs.image.outputs.digest }}
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*-source.tar.gz
            dist/*.whl
          sbom-path: dist/mizuchi.cdx.json
      - name: Release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          IMAGE_URL: ${{ steps.image.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Squash subjects since the previous stable v* tag carry (#N); their
          # labels set the gate flags, so an upgrade from that release sees
          # every gate, including ones shipped in a pre-release. A missing
          # pull request fails the release.
          range="$TAG"
          if prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "${TAG}^" 2>/dev/null)"; then
            range="${prev}..${TAG}"
          fi
          git log --format=%s "$range" > "$RUNNER_TEMP/commits"
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 1000 \
            --json number,labels > "$RUNNER_TEMP/prs.json"
          python3 scripts/release-manifest.py --version "$version" --git-sha "$GITHUB_SHA" \
            --tag "$TAG" --dist dist --out dist/mizuchi-release.json \
            --image "ghcr.io/sannrox/mizuchi:${version}=${IMAGE_DIGEST}" \
            --attestation "$PROVENANCE_URL" --attestation "$IMAGE_URL" --attestation "$SBOM_URL" \
            --commits "$RUNNER_TEMP/commits" --prs "$RUNNER_TEMP/prs.json"
          cat dist/mizuchi-release.json
      - name: Attest release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mizuchi-release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            dist/SHA256SUMS
            dist/mizuchi-release.json
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [source, wheels, image, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.source.result == 'success' && needs.wheels.result == 'success' && needs.image.result == 'success' && needs.attest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/changelog-notes.py "${TAG#v}" > dist/RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.whl dist/mizuchi.cdx.json dist/mizuchi-release.json dist/SHA256SUMS)
          gh release create "$TAG" "${files[@]}" --draft --verify-tag \
            --title "$TAG" \
            --notes-file dist/RELEASE_NOTES.md
          gh release edit "$TAG" --draft=false
