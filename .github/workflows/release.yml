name: Release dry-run

# Tagged and manual only. Never on pull requests. Default cargo test stays
# offline and does not publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: Crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Package workspace crates
        run: |
          for p in mizuchi-core mizuchi-plan mizuchi-io mizuchi-postgres mizuchi-exec mizuchi; do
            echo "::group::$p"
            cargo package --list --locked -p "$p"
            echo "::endgroup::"
          done
      - name: Dry-run crates.io pack (mizuchi-core)
        run: cargo publish --locked --dry-run -p mizuchi-core
      - name: Facade package contains readme
        run: |
          list=$(cargo package --list --locked -p mizuchi)
          printf '%s\n' "$list"
          echo "$list" | grep -Fx README.md
          echo "$list" | grep -Fx src/lib.rs

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          maturin build --release --locked -o dist
