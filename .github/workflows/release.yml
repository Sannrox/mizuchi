name: Release dry-run

# Tagged and manual only. Never on pull requests. Default cargo test stays
# offline and does not publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: Crate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Dry-run crates.io pack
        run: cargo publish --locked --dry-run -p mizuchi
      - name: Package contains readme and license
        run: |
          list=$(cargo package --list --locked -p mizuchi)
          printf '%s\n' "$list"
          echo "$list" | grep -Fx README.md
          echo "$list" | grep -Fx src/lib.rs

  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin
          maturin build --release --locked -o dist
