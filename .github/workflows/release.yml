name: Release

# Runs from main for a signed tag. release-dispatch.yml starts it on a v* tag
# push; a failed run is fixed on main and re-run for the same tag. Never on
# pull requests: CI's release dry run (scripts/validate-release.sh) covers
# these scripts there. Default cargo test stays offline. workflow_dispatch
# without a tag packages the same files and does not attest, push or upload.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag. A second dispatch for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Resolves the release commit every later job checks out. A tagged run must
  # come from main: main's verify-release-tag.sh and allowed keys verify the
  # signed tag against the tagged commit's Cargo.toml, and that commit must be
  # on main. A dry run resolves the checked-out commit and verifies nothing.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-tree
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
      # Checkout leaves the annotated tag object behind; verify-tag needs it.
      - name: Refuse lightweight, unsigned, or mismatched tags
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_ROOT="$PWD" \
            RELEASE_TAG_KEY="${MAIN_TREE}/security/release-tag-key.asc" \
            RELEASE_TAG_FINGERPRINTS="${MAIN_TREE}/security/release-tag-fingerprints" \
            bash "${MAIN_TREE}/scripts/verify-release-tag.sh" verify "$TAG" "$sha"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "tag ${TAG} commit ${sha} is not on main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only a draft or a missing release may continue; any other answer fails.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  source:
    name: Source workspace package
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Package and verify the source workspace
        env:
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
        run: bash scripts/package-source.sh dist
      - name: CycloneDX SBOM
        run: |
          python -m pip install 'cyclonedx-python-lib[json-validation]==11.12.0'
          python scripts/release-sbom.py dist/mizuchi.cdx.json
          python scripts/release-sbom.py --check dist/mizuchi.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-package
          path: |
            dist/*-source.tar.gz
            dist/mizuchi.cdx.json
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.os }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        shell: bash
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin==1.15.0
          maturin build --release --locked -o dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  image:
    name: Container image
    needs: verify-tag
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the tagged commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
      # "Re-run failed jobs" reuses verify-tag's outputs; refuse here too.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Only a draft or a missing release may continue; any other answer fails.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push, and save
        id: push
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/sannrox/mizuchi:${version}"
          docker build -f deploy/Dockerfile -t "$image" .
          docker push "$image"
          # RepoDigests holds name@sha256:... once the push has landed.
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          digest="${digest#*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no registry digest for $image" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          docker save "$image" | gzip > "dist/mizuchi-${version}-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-image
          path: dist/mizuchi-*-image.tar.gz
          if-no-files-found: error

  # Provenance and SBOM attestations, then the Tenkai family release manifest
  # (digests, attestation URLs, gate flags), itself attested.
  attest:
    name: Attest artifacts
    needs: [verify-tag, source, wheels, image]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the tagged commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
      # "Re-run failed jobs" reuses verify-tag's outputs; refuse here too.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Only a draft or a missing release may continue; any other answer fails.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.whl ./mizuchi.cdx.json > SHA256SUMS
      - name: Attest artifacts
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*-source.tar.gz
            dist/*-image.tar.gz
            dist/*.whl
            dist/mizuchi.cdx.json
            dist/SHA256SUMS
      - name: Attest image
        id: image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sannrox/mizuchi
          subject-digest: ${{ needs.image.outputs.digest }}
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*-source.tar.gz
            dist/*.whl
          sbom-path: dist/mizuchi.cdx.json
      # Before the manifest, which lists every dist file with its digest.
      - name: Tenkai profile
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/tenkai-profile.py --check
          python3 scripts/tenkai-profile.py --render --version "${TAG#v}" \
            --digest "$IMAGE_DIGEST" --out dist/mizuchi-tenkai.toml
          cat dist/mizuchi-tenkai.toml
      - name: Release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          IMAGE_URL: ${{ steps.image.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Squash subjects since the previous stable v* tag carry (#N); their
          # labels set the gate flags, so an upgrade from that release sees
          # every gate, including ones shipped in a pre-release. A missing
          # pull request fails the release.
          range="$TAG"
          if prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' "${TAG}^" 2>/dev/null)"; then
            range="${prev}..${TAG}"
          fi
          git log --format=%s "$range" > "$RUNNER_TEMP/commits"
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 1000 \
            --json number,labels > "$RUNNER_TEMP/prs.json"
          python3 scripts/release-manifest.py --version "$version" --git-sha "$SHA" \
            --tag "$TAG" --dist dist --out dist/mizuchi-release.json \
            --image "ghcr.io/sannrox/mizuchi:${version}=${IMAGE_DIGEST}" \
            --attestation "$PROVENANCE_URL" --attestation "$IMAGE_URL" --attestation "$SBOM_URL" \
            --commits "$RUNNER_TEMP/commits" --prs "$RUNNER_TEMP/prs.json"
          cat dist/mizuchi-release.json
      - name: Attest release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mizuchi-release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: |
            dist/SHA256SUMS
            dist/mizuchi-release.json
            dist/mizuchi-tenkai.toml
          if-no-files-found: error

  # Drafts, then publishes last after every asset job, so a failed run leaves
  # a draft that a re-run for the same tag resumes.
  publish:
    name: GitHub Release
    needs: [verify-tag, source, wheels, image, attest]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # "Re-run failed jobs" reuses verify-tag's outputs; refuse here too.
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Only a draft or a missing release may continue; any other answer fails.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: dist
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/changelog-notes.py "${TAG#v}" > dist/RELEASE_NOTES.md
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The release attaches to the remote tag; it must still name SHA.
          [[ "$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)" == "$SHA" ]] \
            || { echo "remote tag ${TAG} no longer points at ${SHA}" >&2; exit 1; }
          files=(dist/*.tar.gz dist/*.whl dist/mizuchi.cdx.json dist/mizuchi-release.json dist/mizuchi-tenkai.toml dist/SHA256SUMS)
          # A tag with a "-" (vX.Y.Z-rc.N) is a pre-release and never latest.
          kind=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=(--prerelease --latest=false)
          fi
          # A re-run resumes its draft; a published release is never touched.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
            # Every run rebuilds every asset; drop the earlier run's so no
            # stale or renamed file is published.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md --draft "${kind[@]}"
          elif [[ "$state" == *"release not found"* ]]; then
            gh release create "$TAG" "${files[@]}" --draft --verify-tag "${kind[@]}" \
              --title "$TAG" \
              --notes-file dist/RELEASE_NOTES.md
          else
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)" == "$SHA" ]] \
            || { echo "remote tag ${TAG} no longer points at ${SHA}" >&2; exit 1; }
          state="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
