name: Lake object store

# Optional job. Never on pull requests. Default cargo test stays offline.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MIZUCHI_S3_ENDPOINT: http://127.0.0.1:9000
  MIZUCHI_S3_BUCKET: mizuchi
  MIZUCHI_S3_ACCESS_KEY: minioadmin
  MIZUCHI_S3_SECRET_KEY: minioadmin

# Read-only token unless a job grants itself more.
permissions:
  contents: read

jobs:
  s3-and-rest:
    name: S3 emulator and REST catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start MinIO
        run: bash scripts/start-s3-emulator.sh
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # cargo-test-exact.sh fails when a renamed test selects nothing.
      - name: In-memory lake and REST (default tests)
        run: |
          bash scripts/cargo-test-exact.sh lake::tests::store_delta_and_iceberg_round_trip --locked -p mizuchi-io --lib
          bash scripts/cargo-test-exact.sh store_merge_and_rest_catalog --locked --test lake
          bash scripts/cargo-test-exact.sh plan::iceberg_rest::tests::memory_rest_catalog_create_load_drop --locked -p mizuchi-plan --lib
      - name: S3 emulator and REST HTTP
        run: cargo test --locked --test s3_emulator --features s3 -- --ignored --test-threads=1
      - name: REST catalog HTTP
        run: bash scripts/cargo-test-exact.sh plan::iceberg_rest::tests::http_rest_catalog_round_trip --locked -p mizuchi-plan --lib -- --ignored --nocapture
