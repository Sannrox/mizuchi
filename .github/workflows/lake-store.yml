name: Lake object store

# Optional job. Never on pull requests. Default cargo test stays offline.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MIZUCHI_S3_ENDPOINT: http://127.0.0.1:9000
  MIZUCHI_S3_BUCKET: mizuchi
  MIZUCHI_S3_ACCESS_KEY: minioadmin
  MIZUCHI_S3_SECRET_KEY: minioadmin

jobs:
  s3-and-rest:
    name: S3 emulator and REST catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c \
            "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb local/mizuchi"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: In-memory lake and REST (default tests)
        run: |
          cargo test --locked --lib lake::tests::store_delta_and_iceberg_round_trip
          cargo test --locked --test lake store_merge_and_rest_catalog
          cargo test --locked --lib memory_rest_catalog_create_load_drop
      - name: S3 emulator and REST HTTP
        run: cargo test --locked --test s3_emulator --features s3 -- --ignored --test-threads=1
      - name: REST catalog HTTP
        run: cargo test --locked --lib http_rest_catalog_round_trip -- --ignored --nocapture
