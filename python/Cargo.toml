[package]
name = "mizuchi-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Python bindings for mizuchi."

# Independent workspace: not a member of the Rust library workspace, so
# `cargo test --workspace` stays rust-only.
[workspace]

[lib]
name = "mizuchi"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "60.0.0", default-features = false, features = ["ffi"] }
mizuchi = { path = "../crates/mizuchi" }
pyo3 = { version = "0.25", features = ["abi3-py310", "extension-module"] }
