# Three Flight workers plus a coordinator and a standby that takes over
# through the fenced lease in /spill/lease (ADR 0016). The engine binds TCP only when
# MIZUCHI_ALLOW_NETWORK is set.
services:
  worker1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker", "--bind", "0.0.0.0:8815"]
    environment:
      MIZUCHI_ALLOW_NETWORK: "1"
      MIZUCHI_SPILL: /spill
      MIZUCHI_LEASE_DIR: /spill/lease
    volumes:
      - spill:/spill
    expose:
      - "8815"
  worker2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker", "--bind", "0.0.0.0:8815"]
    environment:
      MIZUCHI_ALLOW_NETWORK: "1"
      MIZUCHI_SPILL: /spill
      MIZUCHI_LEASE_DIR: /spill/lease
    volumes:
      - spill:/spill
    expose:
      - "8815"
  worker3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker", "--bind", "0.0.0.0:8815"]
    environment:
      MIZUCHI_ALLOW_NETWORK: "1"
      MIZUCHI_SPILL: /spill
      MIZUCHI_LEASE_DIR: /spill/lease
    volumes:
      - spill:/spill
    expose:
      - "8815"
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      [
        "coordinator",
        "--workers",
        "worker1:8815,worker2:8815,worker3:8815",
        "--sql",
        "SELECT SUM(a) AS s FROM t",
      ]
    environment:
      MIZUCHI_ALLOW_NETWORK: "1"
      MIZUCHI_SPILL: /spill
      # Leader and standby share the lease directory (ADR 0016).
      MIZUCHI_LEASE_DIR: /spill/lease
      MIZUCHI_HOLDER: coordinator
    volumes:
      - spill:/spill
    depends_on:
      - worker1
      - worker2
      - worker3
  coordinator-standby:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      [
        "coordinator",
        "--workers",
        "worker1:8815,worker2:8815,worker3:8815",
        "--sql",
        "SELECT SUM(a) AS s FROM t",
      ]
    environment:
      MIZUCHI_ALLOW_NETWORK: "1"
      MIZUCHI_SPILL: /spill
      MIZUCHI_LEASE_DIR: /spill/lease
      MIZUCHI_HOLDER: coordinator-standby
    volumes:
      - spill:/spill
    depends_on:
      - worker1
      - worker2
      - worker3
volumes:
  spill:
