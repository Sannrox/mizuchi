# Kubernetes layout for coordinator and Flight worker replicas.
# TCP is opened only when MIZUCHI_ALLOW_NETWORK is set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizuchi-coordinator
spec:
  # A leader and a standby; the lease keeps one in charge (ADR 0016).
  replicas: 2
  selector:
    matchLabels:
      app: mizuchi-coordinator
  template:
    metadata:
      labels:
        app: mizuchi-coordinator
    spec:
      containers:
        - name: coordinator
          image: mizuchi:local
          args: ["coordinator", "--workers", "mizuchi-worker:8815"]
          env:
            - name: MIZUCHI_ALLOW_NETWORK
              value: "1"
            - name: MIZUCHI_WORKERS
              value: "mizuchi-worker:8815"
            - name: MIZUCHI_LEASE_DIR
              value: /lease
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: spill
              mountPath: /spill
            - name: lease
              mountPath: /lease
      volumes:
        - name: spill
          emptyDir: {}
        # Shared by every coordinator replica.
        - name: lease
          persistentVolumeClaim:
            claimName: mizuchi-coordinator-lease
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizuchi-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mizuchi-worker
  template:
    metadata:
      labels:
        app: mizuchi-worker
    spec:
      containers:
        - name: worker
          image: mizuchi:local
          args: ["worker", "--bind", "0.0.0.0:8815"]
          env:
            - name: MIZUCHI_ALLOW_NETWORK
              value: "1"
            - name: MIZUCHI_SPILL
              value: /spill
            # Workers check fencing tokens against the coordinators' lease.
            - name: MIZUCHI_LEASE_DIR
              value: /lease
          resources:
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: spill
              mountPath: /spill
            - name: lease
              mountPath: /lease
      volumes:
        - name: spill
          emptyDir: {}
        - name: lease
          persistentVolumeClaim:
            claimName: mizuchi-coordinator-lease
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mizuchi-coordinator-lease
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 16Mi
