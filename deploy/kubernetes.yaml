# Kubernetes layout for a coordinator and Flight worker replicas.
# TCP is opened only when MIZUCHI_ALLOW_NETWORK is set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizuchi-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mizuchi-coordinator
  template:
    metadata:
      labels:
        app: mizuchi-coordinator
    spec:
      containers:
        - name: coordinator
          image: mizuchi:local
          args: ["coordinator", "--workers", "mizuchi-worker:8815"]
          env:
            - name: MIZUCHI_ALLOW_NETWORK
              value: "1"
            - name: MIZUCHI_WORKERS
              value: "mizuchi-worker:8815"
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: spill
              mountPath: /spill
      volumes:
        - name: spill
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mizuchi-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mizuchi-worker
  template:
    metadata:
      labels:
        app: mizuchi-worker
    spec:
      containers:
        - name: worker
          image: mizuchi:local
          args: ["worker", "--bind", "0.0.0.0:8815"]
          env:
            - name: MIZUCHI_ALLOW_NETWORK
              value: "1"
            - name: MIZUCHI_SPILL
              value: /spill
          resources:
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: spill
              mountPath: /spill
      volumes:
        - name: spill
          emptyDir: {}
