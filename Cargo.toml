[workspace]
members = ["crates/mizuchi"]
default-members = ["crates/mizuchi"]
exclude = ["python", "fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Sannrox/mizuchi"
publish = false

[workspace.dependencies]
arrow = { version = "60.0.0", default-features = false, features = ["csv", "ipc", "ffi"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
sqlparser = { version = "0.63.0" }
object_store = { version = "0.14.1", default-features = false }
futures = { version = "0.3.31", default-features = false, features = ["std", "executor"] }
serde_json = { version = "1.0.152", default-features = false, features = ["std"] }
